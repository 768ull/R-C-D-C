plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chronos.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chronos.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Alinha os módulos legados do Kotlin (jdk7/jdk8) com a versão do
    // kotlin-stdlib trazida pelo AndroidX, evitando o erro de classes
    // duplicadas na tarefa checkDebugDuplicateClasses.
    constraints {
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
